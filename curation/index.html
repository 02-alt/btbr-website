<body>
  <div class="frame curation-frame">
    <header class="feedbar">
      <a class="feedbar-brand" href="/"><strong>builtoberemembered</strong> <span>An ongoing curation</span></a>
      <div class="feedbar-tools">
        <a class="feedbar-studio studio-reveal" href="/admin/" hidden>Studio</a>
        <a class="icon-btn" href="mailto:isaaaaaaaac@pm.me" aria-label="Email" title="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></a>
        <button class="lang-btn" type="button" aria-label="Lire en français" title="Lire en français">EN</button>
      </div>
    </header>

    <main class="curation" id="curationFeed" data-curation>
      <h1 class="sr-only">Curation</h1>
    </main>

    <!-- the room: a topic opens here, grown out of its card's cover tray (app.js) -->
    <div class="cur-modal" hidden>
      <div class="cur-modal-backdrop"></div>
      <div class="cur-modal-panel" role="dialog" aria-modal="true" aria-labelledby="curRoomTitle">
        <div class="cur-room-tools">
          <button class="lang-btn cur-modal-lang" type="button" aria-label="Lire en français" title="Lire en français">EN</button>
          <button class="cur-modal-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
        </div>
        <div class="cur-modal-body">
          <nav class="cur-toc" aria-label="Contents" hidden></nav>
          <div class="cur-article">
            <div class="cur-label"></div>
            <div class="cur-modal-content"></div>
            <aside class="cur-sources" hidden>
              <div class="cur-sources-title">Sources</div>
              <ul class="cur-sources-list"></ul>
            </aside>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/app.js?v=10"></script>
</body>
